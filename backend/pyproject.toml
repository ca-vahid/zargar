[project]
name = "zargar"
version = "0.7.1"
description = "Zargar — personal trading engine (IBKR + simulation + signal ingestion)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pywebpush>=2.0",
    "PyJWT[crypto]>=2.8",
    "anthropic>=0.40",
    "python-dateutil>=2.9",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
ibkr = ["ib_async>=1.0.1"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zargar*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
